<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Benson</title>
  <desc id="desc">Backend engineering and agent runtimes. A diagram shows an event flowing through an API to state and tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1528"/>
      <stop offset="1" stop-color="#102a39"/>
    </linearGradient>
    <linearGradient id="trace" x1="740" y1="0" x2="1083" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#71aefa"/>
      <stop offset="1" stop-color="#69e4c7"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.15" fill="#8cabb8" opacity=".18"/>
    </pattern>
    <linearGradient id="mask-fade" x1="505" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="480" y="0" width="720" height="270">
      <rect x="480" width="720" height="270" fill="url(#mask-fade)"/>
    </mask>
    <clipPath id="frame"><rect width="1200" height="270" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="270" fill="url(#background)"/>
    <rect x="480" width="720" height="270" fill="url(#grid)" mask="url(#fade)"/>
    <path d="M64 61h43" stroke="#6de1c5" stroke-width="4" stroke-linecap="round"/>
    <text x="62" y="143" fill="#f2f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-3">Benson</text>
    <text x="66" y="194" fill="#b5c8d7" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="500">Backend engineering · Agent runtimes</text>
    <g fill="none" stroke="url(#trace)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M727 135h50m127 0h25a20 20 0 0 0 20-20v-13a19 19 0 0 1 19-19h25"/>
      <path d="M929 135a20 20 0 0 1 20 20v13a19 19 0 0 0 19 19h25"/>
    </g>
    <circle cx="929" cy="135" r="4" fill="#80d4db"/>
    <g font-family="Consolas, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">
      <rect x="619" y="114" width="108" height="42" rx="9" fill="#152a40" stroke="#3c668a"/>
      <text x="673" y="141" fill="#b7d9fc">EVENT</text>
      <rect x="777" y="104" width="127" height="62" rx="12" fill="#173c4c" stroke="#62a9bb"/>
      <text x="840.5" y="141" fill="#e5f8fb">API</text>
      <rect x="993" y="62" width="120" height="42" rx="9" fill="#123641" stroke="#4e998f"/>
      <text x="1053" y="89" fill="#a0eed7">STATE</text>
      <rect x="993" y="166" width="120" height="42" rx="9" fill="#123641" stroke="#4e998f"/>
      <text x="1053" y="193" fill="#a0eed7">TOOLS</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="269" rx="19.5" fill="none" stroke="#23414e"/>
</svg>
