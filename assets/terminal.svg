<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 212" width="1200" height="212" role="img" aria-labelledby="title description">
  <title id="title">BearCode local entry points</title>
  <desc id="description">Use python -m agents.web for the web workbench or python -m agents.main for the CLI.</desc>
  <style>
    .cursor { animation: blink 1.35s steps(1, end) infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ping 3s ease-out infinite; }
    @keyframes blink { 50% { opacity: .24; } }
    @keyframes ping { 0% { transform: scale(.75); opacity: .65; } 75%, 100% { transform: scale(1.65); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .ring { animation: none; } .ring { opacity: .25; } }
  </style>
  <defs>
    <linearGradient id="terminal-bg" x2="100%" y2="0%">
      <stop stop-color="#0A1122"/>
      <stop offset="1" stop-color="#151936"/>
    </linearGradient>
    <clipPath id="terminal-frame"><rect width="1200" height="212" rx="17"/></clipPath>
  </defs>
  <g clip-path="url(#terminal-frame)">
    <rect width="1200" height="212" fill="url(#terminal-bg)"/>
    <rect width="1200" height="53" fill="#1C2541"/>
    <circle cx="28" cy="27" r="5" fill="#F186A6"/>
    <circle cx="45" cy="27" r="5" fill="#FFD391"/>
    <circle cx="62" cy="27" r="5" fill="#69DFBF"/>
    <text x="90" y="33" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#D9E4FC">BearCode / local entry points</text>
    <g font-family="Consolas, Menlo, monospace" font-size="28">
      <text x="30" y="109" fill="#79E4CB">$</text>
      <text x="57" y="109" fill="#E1EAFF">python -m agents.web</text>
      <text x="30" y="166" fill="#B99CFF">$</text>
      <text x="57" y="166" fill="#E1EAFF">python -m agents.main</text>
      <rect class="cursor" x="398" y="143" width="11" height="27" rx="2" fill="#B99CFF"/>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="23">
      <rect x="700" y="78" width="469" height="45" rx="10" fill="#152B3B" stroke="#2D5662"/>
      <circle class="ring" cx="723" cy="101" r="7" fill="none" stroke="#69DFBF" stroke-width="2"/>
      <circle cx="723" cy="101" r="4" fill="#69DFBF"/>
      <text x="743" y="109" fill="#B4EADD">WEB · 127.0.0.1:8765</text>
      <rect x="700" y="135" width="469" height="45" rx="10" fill="#242244" stroke="#50447B"/>
      <circle cx="723" cy="158" r="4" fill="#B99CFF"/>
      <text x="743" y="166" fill="#E0D2FF">CLI</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="211" rx="16.5" fill="none" stroke="#364165"/>
</svg>
